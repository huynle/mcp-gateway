apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-gateway

resources:
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: mcp-gateway-config
    behavior: merge
    literals:
      - GATEWAY_ALLOW_ORIGINS=["https://mcp-gateway.example.com"]
      - GATEWAY_LOG_LEVEL=info
      - ATLASSIAN_MOCK=false

secretGenerator:
  - name: mcp-gateway-secret
    behavior: replace
    literals:
      - GATEWAY_ADMIN_TOKEN=replace-with-long-random-bootstrap-token
      - GATEWAY_SECRET_KEY=replace-with-long-random-secret-key
      - GATEWAY_ENCRYPTION_KEY=replace-with-fernet-key
      - GATEWAY_DATABASE_URL=postgresql+psycopg://mcp_gateway:replace-with-password@replace-with-managed-postgres-host:5432/mcp_gateway
  - name: first-party-mcp-secret
    behavior: replace
    literals:
      - GATEWAY_FIRST_PARTY_INTERNAL_TOKEN=replace-with-long-random-internal-token
      - ATLASSIAN_INTERNAL_TOKEN=replace-with-long-random-internal-token

images:
  - name: ghcr.io/your-org/mcp-gateway
    newName: ghcr.io/your-org/mcp-gateway
    newTag: replace-with-immutable-tag
