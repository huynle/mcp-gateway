apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-gateway

resources:
  - ../../base
  - postgres.yaml

configMapGenerator:
  - name: mcp-gateway-config
    behavior: merge
    literals:
      - ATLASSIAN_MOCK=true
      - GATEWAY_ALLOW_INSECURE_BOOTSTRAP=true

secretGenerator:
  - name: mcp-gateway-secret
    behavior: replace
    literals:
      - GATEWAY_ADMIN_TOKEN=local-admin-token
      - GATEWAY_SECRET_KEY=local-secret-key
      - GATEWAY_ENCRYPTION_KEY=WpB-6_RzIvz2FZMfNfyWuIYfJ3VAwJvA9SRuB7rj2rw=
      - GATEWAY_DATABASE_URL=postgresql+psycopg://mcp_gateway:mcp_gateway@mcp-gateway-postgres:5432/mcp_gateway
  - name: first-party-mcp-secret
    behavior: replace
    literals:
      - GATEWAY_FIRST_PARTY_INTERNAL_TOKEN=local-internal-token
      - ATLASSIAN_INTERNAL_TOKEN=local-internal-token

images:
  - name: ghcr.io/your-org/mcp-gateway
    newName: mcp-gateway
    newTag: local
