apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcp-gateway-postgres
  labels:
    app.kubernetes.io/name: mcp-gateway-postgres
spec:
  serviceName: mcp-gateway-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: mcp_gateway
            - name: POSTGRES_USER
              value: mcp_gateway
            - name: POSTGRES_PASSWORD
              value: mcp_gateway
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-postgres
spec:
  selector:
    app.kubernetes.io/name: mcp-gateway-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
