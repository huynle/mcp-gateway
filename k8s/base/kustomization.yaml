apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-gateway

generatorOptions:
  disableNameSuffixHash: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - jira-deployment.yaml
  - jira-service.yaml
  - confluence-deployment.yaml
  - confluence-service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: mcp-gateway-config
    literals:
      - GATEWAY_LOG_LEVEL=info
      - GATEWAY_TOOL_CACHE_TTL_SECONDS=60
      - GATEWAY_SERVICE_NAME=mcp-gateway
      - GATEWAY_AUTO_CREATE_SCHEMA=false
      - GATEWAY_METRICS_ENABLED=true
      - GATEWAY_MAX_REQUEST_BYTES=1048576
      - ATLASSIAN_MOCK=false

secretGenerator:
  - name: mcp-gateway-secret
    literals:
      - GATEWAY_ADMIN_TOKEN=replace-me-admin-token
      - GATEWAY_SECRET_KEY=replace-me-secret-key
      - GATEWAY_ENCRYPTION_KEY=WpB-6_RzIvz2FZMfNfyWuIYfJ3VAwJvA9SRuB7rj2rw=
      - GATEWAY_DATABASE_URL=postgresql+psycopg://mcp_gateway:replace-me@mcp-gateway-postgres:5432/mcp_gateway
  - name: first-party-mcp-secret
    literals:
      - GATEWAY_FIRST_PARTY_INTERNAL_TOKEN=replace-me-internal-token
      - ATLASSIAN_INTERNAL_TOKEN=replace-me-internal-token

images:
  - name: mcp-gateway
    newName: ghcr.io/your-org/mcp-gateway
    newTag: latest
