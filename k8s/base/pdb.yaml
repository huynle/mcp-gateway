apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jira-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/component: jira-mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: confluence-mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/component: confluence-mcp
