apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: mcp-gateway
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: mcp-gateway
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              for attempt in $(seq 1 30); do
                if alembic upgrade head; then
                  exit 0
                fi
                echo "migration attempt ${attempt} failed; retrying"
                sleep 5
              done
              exit 1
          envFrom:
            - configMapRef:
                name: mcp-gateway-config
            - secretRef:
                name: mcp-gateway-secret
            - secretRef:
                name: first-party-mcp-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gateway
          image: mcp-gateway
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["mcp_gateway.app:create_gateway_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          envFrom:
            - configMapRef:
                name: mcp-gateway-config
            - secretRef:
                name: mcp-gateway-secret
            - secretRef:
                name: first-party-mcp-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
