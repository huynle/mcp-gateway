apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-mcp
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: jira-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/component: jira-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/component: jira-mcp
    spec:
      serviceAccountName: mcp-gateway
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jira-mcp
          image: mcp-gateway
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["mcp_gateway.atlassian:create_jira_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          envFrom:
            - configMapRef:
                name: mcp-gateway-config
            - secretRef:
                name: first-party-mcp-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
