version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/huynle/mcp-gateway
