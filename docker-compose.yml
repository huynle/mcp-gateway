# Local development stack. Ports are deliberately off the defaults
# (15432 / 15556 / 18080) so several checkouts or other services on this
# machine do not collide. See .env.example for every GATEWAY_ variable.
#
#   make compose-up      # build + start, waits for health
#   curl -f localhost:18080/healthz
#   curl -f localhost:18080/readyz
#   make compose-down    # stop and drop volumes
#
# Database roles (dev credentials only; see deploy/postgres/init/01-roles.sql):
#   gateway       superuser, owns the schema, runs migrations
#                 postgres://gateway:gateway-dev@localhost:15432/gateway?sslmode=disable
#   gateway_app   request path, subject to row-level security
#                 postgres://gateway_app:gateway-app-dev@localhost:15432/gateway?sslmode=disable
#   gateway_jobs  background jobs and admin metadata, bypasses RLS
#                 postgres://gateway_jobs:gateway-jobs-dev@localhost:15432/gateway?sslmode=disable

name: mcp-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-dev
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates gateway_app / gateway_jobs with LOGIN passwords on first start.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pre-upgrade job: applies the embedded goose migrations as the owner, the
  # same way a Kubernetes Job would before a rollout. The gateway never
  # migrates itself and refuses to start on a schema version mismatch.
  migrate:
    build:
      context: .
      args:
        VERSION: compose
    entrypoint: ["/migrate", "up"]
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: "postgres://gateway:gateway-dev@postgres:5432/gateway?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Mock company identity provider (OIDC). Static users dev@example.com,
  # alice@example.com (allowed) and mallory@evil.test (rejected), all with
  # password "password"; static client "gateway". The issuer is
  # http://localhost:15556/dex so browser redirects and discovery match from
  # the host; dex listens on 15556 inside the container too so the same URL
  # works for a gateway running on the host with `go run`. The gateway
  # container reaches it through the "localhost" alias below.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "15556:15556"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:15556/dex/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev key file for the envelope-encryption key provider (docs/crypto.md):
  # generated once into the gateway-keys volume (a fresh random key, mode
  # 0600, owned by the gateway's non-root user) and kept until
  # `make compose-down` drops the volumes together with the database it
  # encrypts for. With it the gateway mounts approvals and app connections,
  # so the fake connector's confirmed and ledgered writes work end to end.
  keys:
    image: alpine:3.21
    command:
      - sh
      - -ec
      - |
        f=/keys/dev-keys.json
        if [ ! -s "$$f" ]; then
          umask 077
          k=$$(head -c 32 /dev/urandom | base64 | tr -d '\n')
          printf '{"current":"compose-1","keys":[{"id":"compose-1","key":"%s"}]}\n' "$$k" > "$$f"
        fi
        chown 65532:65532 "$$f"
        chmod 0600 "$$f"
    volumes:
      - gateway-keys:/keys
    restart: "no"

  gateway:
    build:
      context: .
      args:
        VERSION: compose
    environment:
      GATEWAY_LISTEN_ADDR: ":18080"
      GATEWAY_DRAIN_TIMEOUT: "25s"
      GATEWAY_LOG_LEVEL: "debug"
      GATEWAY_LOG_FORMAT: "text"
      GATEWAY_DATABASE_URL: "postgres://gateway_app:gateway-app-dev@postgres:5432/gateway?sslmode=disable"
      GATEWAY_JOBS_DATABASE_URL: "postgres://gateway_jobs:gateway-jobs-dev@postgres:5432/gateway?sslmode=disable"
      # Company sign-in through the Compose dex (see deploy/dex/config.yaml).
      GATEWAY_BASE_URL: "http://localhost:18080"
      GATEWAY_MCP_MAX_BODY: "1048576" # /mcp request body limit in bytes
      GATEWAY_ENABLE_FAKE_CONNECTOR: "true" # make-believe "fake" app for local harness smoke tests
      GATEWAY_RATE_USER_PER_MIN: "60"
      GATEWAY_RATE_APP_PER_MIN: "600"
      GATEWAY_SESSION_COOKIE_SECURE: "false" # plain http on localhost
      GATEWAY_OIDC_PROVIDERS: "dex"
      GATEWAY_OIDC_DEX_DISPLAY_NAME: "Local dex"
      GATEWAY_OIDC_DEX_ISSUER: "http://localhost:15556/dex"
      GATEWAY_OIDC_DEX_CLIENT_ID: "gateway"
      GATEWAY_OIDC_DEX_CLIENT_SECRET: "gateway-dev-secret"
      GATEWAY_OIDC_DEX_ALLOWED_DOMAINS: "example.com"
      GATEWAY_BOOTSTRAP_ADMINS: "http://localhost:15556/dex|CiQwOGE4Njg0Yi1kYjg4LTRiNzMtOTBhOS0zY2QxNjYxZjU0NjYSBWxvY2Fs"
      # Dev key file from the keys service (see above). Never for production.
      GATEWAY_KEY_PROVIDER: "file"
      GATEWAY_KEY_FILE: "/keys/dev-keys.json"
    volumes:
      - gateway-keys:/keys:ro
    ports:
      - "18080:18080"
    # The OIDC issuer must be one URL for both the browser (host) and the
    # gateway (container): dex's issuer is http://localhost:15556/dex, so
    # inside the container "localhost" also resolves to the Docker host,
    # where Compose publishes dex on 15556. Go tries 127.0.0.1 first (refused
    # immediately, nothing listens there in the container) and then the host.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keys:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    # Match Kubernetes' terminationGracePeriodSeconds: must exceed GATEWAY_DRAIN_TIMEOUT.
    stop_grace_period: 30s

volumes:
  postgres-data:
  gateway-keys:
