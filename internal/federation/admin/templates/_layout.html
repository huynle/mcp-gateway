{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{.Title}} · MCP Gateway</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #fafafa; --muted: #6b6b6b; --line: #d9d9d9; --accent: #2457c5; --danger: #b3261e; --ok: #1b7f3b; --warn: #8a5a00; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --bg: #141414; --muted: #9a9a9a; --line: #333; --accent: #7aa2ff; } }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    header { border-bottom: 1px solid var(--line); padding: .75rem 1.25rem; display: flex; gap: 1.5rem; align-items: center; }
    header .brand { font-weight: 600; text-decoration: none; color: inherit; }
    header nav a { margin-right: 1rem; color: var(--accent); text-decoration: none; }
    header .who { margin-left: auto; color: var(--muted); display: flex; gap: .75rem; align-items: center; }
    main { max-width: 64rem; margin: 2rem auto; padding: 0 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; font-size: .85rem; }
    .btn { display: inline-block; padding: .4rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { color: var(--danger); border-color: var(--danger); }
    .muted { color: var(--muted); }
    .pill { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .8rem; border: 1px solid var(--line); }
    .pill.active { color: var(--ok); border-color: var(--ok); }
    .pill.revoked, .pill.expired, .pill.needs_reconnect { color: var(--danger); border-color: var(--danger); }
    .pill.company { color: var(--accent); border-color: var(--accent); }
    .actions form { display: inline; margin-right: .3rem; }
    .actions input[type=text] { width: 14rem; }
    .vendor { margin-top: 2rem; }
    .stack { display: grid; gap: .75rem; max-width: 32rem; }
    label { display: grid; gap: .25rem; }
    input[type=text], input[type=number], textarea { font: inherit; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    .check { display: flex; align-items: center; gap: .5rem; }
    .error { border: 1px solid var(--danger); border-radius: 6px; padding: .75rem 1rem; color: var(--danger); }
    .notice { border: 1px solid var(--warn); border-radius: 6px; padding: .75rem 1rem; }
    .ok { border: 1px solid var(--ok); border-radius: 6px; padding: .75rem 1rem; }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
    pre { border: 1px solid var(--line); border-radius: 6px; padding: .75rem 1rem; overflow-x: auto; }
    .token { font-size: 1rem; user-select: all; word-break: break-all; }
    form.inline { display: inline; }
    .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .8rem; border: 1px solid var(--warn); color: var(--warn); }
    .pill.none { color: var(--muted); }
    .desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: .25rem 0; }
    .preview { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30rem; overflow-y: auto; }
    .added { color: var(--ok); } .removed { color: var(--danger); } .changed { color: var(--warn); }
    fieldset { border: 1px solid var(--line); border-radius: 6px; display: grid; gap: .75rem; }
    select { font: inherit; padding: .3rem .4rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    .subnav { margin: 0 0 1rem; color: var(--muted); }
    .subnav a { color: var(--accent); text-decoration: none; }
    .danger-zone { border: 1px solid var(--danger); border-radius: 6px; padding: .75rem 1rem; margin-top: 1.5rem; }
    input[type=password], input[type=url] { font: inherit; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  </style>
</head>
<body>
{{template "nav" navData}}
<main>
<h1>{{.Title}}</h1>
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}

{{define "subnav"}}<p class="subnav"><a href="/admin/servers">All servers</a> · <a href="/admin/servers/reviews">Review queue</a> · <a href="/admin/tunnels">Tunnels</a> · <a href="/admin/network/allow-hosts">Network allow-list</a></p>{{end}}
