{{template "head" .}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/tokens/new" class="stack" autocomplete="off">
  <input type="hidden" name="_csrf" value="{{.Caller.CSRFToken}}">
  <label>Name
    <input type="text" name="name" value="{{.Name}}" maxlength="{{.MaxNameLen}}" required placeholder="laptop, CI runner, ...">
  </label>
  <label>Expires in (days)
    <input type="number" name="expiry_days" value="{{.ExpiryDays}}" min="1" max="{{.MaxExpiryDays}}" required>
    <span class="muted">At most {{.MaxExpiryDays}} days. The token also stops working if you have not signed in here for 30 days.</span>
  </label>
  <label class="check">
    <input type="checkbox" name="read_only"{{if .ReadOnly}} checked{{end}}> Read-only (no tool that writes, whatever your role allows)
  </label>
  <label>Limit to apps or tools (optional)
    <textarea name="allow_list" rows="3" placeholder="github, slack.post_message">{{.AllowList}}</textarea>
    <span class="muted">Comma- or space-separated. An app name allows all of its tools; <code>app.tool</code> allows exactly that tool. Empty means everything your role allows.</span>
  </label>
  <div>
    <button class="btn primary" type="submit">Create token</button>
    <a class="btn" href="/tokens">Cancel</a>
  </div>
</form>
{{template "foot" .}}
