# Smoke-test PostgreSQL for the kind cluster (deploy/smoke/kind-smoke.sh).
# Dev credentials only, mirrors docker-compose.yml and
# deploy/postgres/init/01-roles.sql. Not for any real environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-roles.sql: |
    CREATE ROLE gateway_app  LOGIN PASSWORD 'gateway-app-dev'  NOBYPASSRLS;
    CREATE ROLE gateway_jobs LOGIN PASSWORD 'gateway-jobs-dev' BYPASSRLS;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              value: gateway-dev
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
