name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-build-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Compile Python
        run: python -m compileall -q src migrations

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.1"

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/base >/tmp/mcp-gateway-base.yaml
          kubectl kustomize k8s/overlays/local >/tmp/mcp-gateway-local.yaml
          kubectl kustomize k8s/overlays/production >/tmp/mcp-gateway-production.yaml

      - name: Parse rendered Kubernetes YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for rendered in [
              "/tmp/mcp-gateway-base.yaml",
              "/tmp/mcp-gateway-local.yaml",
              "/tmp/mcp-gateway-production.yaml",
          ]:
              docs = [d for d in yaml.safe_load_all(Path(rendered).read_text()) if d]
              assert docs, rendered
              for doc in docs:
                  assert doc.get("apiVersion"), (rendered, doc)
                  assert doc.get("kind"), (rendered, doc)
                  assert doc.get("metadata", {}).get("name"), (rendered, doc)
          PY

      - name: Build Docker image
        run: docker build -t mcp-gateway:ci .
